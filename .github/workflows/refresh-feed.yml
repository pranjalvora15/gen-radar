name: Refresh learning feed

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-learning-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install server dependencies
        run: npm ci --workspace server --omit=dev

      - name: Refresh feed when stale
        run: npm run refresh
        env:
          DATABASE_URL: ${{ secrets.CLEANUP_DATABASE_URL }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL || 'https://gen-radar-ai.onrender.com' }}
          AI_INTERNAL_API_KEY: ${{ secrets.AI_INTERNAL_API_KEY }}
          FEED_REFRESH_INTERVAL_HOURS: "48"
